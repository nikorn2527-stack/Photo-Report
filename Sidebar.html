<!DOCTYPE html>
<html lang="th">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      :root {
        --green: #188038;
        --green-dark: #0d652d;
        --blue: #1967d2;
        --text: #202124;
        --muted: #5f6368;
        --border: #c7cbd1;
        --surface: #f6f8fb;
        --danger: #b3261e;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: #eef1f5;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }

      body { padding: 12px; }
      .app { width: 100%; max-width: 620px; margin: 0 auto; }

      .template-page {
        width: 100%;
        min-height: 794px;
        padding: 18px;
        border: 1px solid #b9bec6;
        border-radius: 5px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(60, 64, 67, .15);
      }

      .report-header {
        padding-bottom: 14px;
        border-bottom: 2px solid #202124;
        text-align: center;
      }

      .report-title { margin: 0; font-size: 23px; line-height: 1.2; letter-spacing: .05em; }
      .report-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

      .job-section { margin-top: 14px; }
      .field { margin-bottom: 12px; }
      .field:last-child { margin-bottom: 0; }
      label, .field-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }

      select, input[type="text"] {
        width: 100%;
        min-height: 46px;
        padding: 10px 11px;
        border: 1px solid #9aa0a6;
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      input[readonly] { background: var(--surface); color: var(--muted); }
      select:focus, input:focus, button:focus-visible, .photo-slot:focus-visible {
        outline: 3px solid rgba(25, 103, 210, .24);
        outline-offset: 2px;
      }

      .photo-section { margin-top: 18px; }
      .section-heading { margin: 0 0 8px; font-size: 16px; }
      .section-note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

      .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .photo-slot-wide { grid-column: 1 / -1; }

      .photo-slot {
        position: relative;
        display: flex;
        min-height: 170px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0;
        border: 2px dashed #9aa0a6;
        border-radius: 8px;
        background: #fafbfc;
        color: var(--muted);
        cursor: pointer;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }

      .photo-slot-wide { min-height: 190px; }
      .photo-slot:hover { border-color: var(--blue); background: #f4f8ff; }
      .photo-slot.is-filled { border-style: solid; border-color: var(--green); background: #fff; }
      .slot-content { width: 100%; padding: 12px; }
      .slot-label { display: block; color: var(--text); font-weight: 600; font-size: 14px; }
      .slot-hint { display: block; margin-top: 5px; font-size: 12px; }
      .slot-image { display: block; width: 100%; height: 100%; min-height: 166px; object-fit: contain; background: #f1f3f4; }
      .photo-slot-wide .slot-image { min-height: 186px; }
      .slot-status { position: absolute; right: 7px; bottom: 6px; padding: 2px 6px; border-radius: 9px; background: rgba(24, 128, 56, .9); color: #fff; font-size: 11px; }

      .report-footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; text-align: center; }
      .status { min-height: 22px; margin-top: 10px; color: var(--muted); font-size: 14px; text-align: center; }
      .status.error { color: var(--danger); }
      .status.success { color: var(--green-dark); }

      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: none;
        align-items: flex-end;
        justify-content: center;
        padding: 12px;
        background: rgba(32, 33, 36, .52);
      }

      .modal-backdrop.is-open { display: flex; }
      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 92vh;
        overflow-y: auto;
        padding: 18px;
        border-radius: 16px 16px 8px 8px;
        background: #fff;
        box-shadow: 0 -4px 18px rgba(0, 0, 0, .2);
      }

      .modal-title { margin: 0; font-size: 19px; }
      .modal-note { margin: 5px 0 14px; color: var(--muted); font-size: 13px; }
      .source-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button { min-height: 48px; padding: 11px 14px; border: 0; border-radius: 9px; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { background: #9aa0a6 !important; cursor: wait; }
      .button-gallery { background: var(--blue); }
      .button-camera { background: #5f6368; }
      .button-save { width: 100%; margin-top: 12px; background: var(--green); font-size: 16px; }
      .button-save:not(:disabled):hover { background: var(--green-dark); }
      .button-cancel { width: 100%; margin-top: 8px; background: #fff; color: var(--text); border: 1px solid #9aa0a6; }
      .pending-preview { display: none; margin-top: 14px; }
      .pending-preview.is-visible { display: block; }
      .pending-preview img { display: block; width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: #f1f3f4; }
      .pending-file { margin-top: 6px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

      .required-note { color: var(--muted); font-size: 12px; font-weight: 400; }
      .hidden-input { display: none; }

      @media (max-width: 380px) {
        body { padding: 8px; }
        .template-page { padding: 13px; }
        .photo-grid, .source-buttons { grid-template-columns: 1fr; }
        .photo-slot-wide { grid-column: auto; }
      }

      @media print {
        html, body { background: #fff; }
        body { padding: 0; }
        .template-page { max-width: none; min-height: 0; border: 0; box-shadow: none; }
        .modal-backdrop, .status { display: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="template-page" aria-label="แบบฟอร์ม Photo Report">
        <header class="report-header">
          <h1 class="report-title">PHOTO REPORT</h1>
          <p class="report-subtitle">แบบฟอร์มบันทึกรูปภาพหน้างาน</p>
        </header>

        <section class="job-section">
          <div class="field">
            <label for="jobSelect">เลข Job <span class="required-note">(จำเป็น)</span></label>
            <select id="jobSelect">
              <option value="">กำลังโหลดรายการ Job...</option>
            </select>
          </div>
          <div class="field">
            <label for="locationDisplay">สถานที่ติดตั้ง</label>
            <input type="text" id="locationDisplay" readonly placeholder="จะแสดงหลังเลือก Job">
          </div>
        </section>

        <section class="photo-section">
          <h2 class="section-heading">รูปภาพประกอบรายงาน</h2>
          <p class="section-note">แตะช่องที่ต้องการ แล้วเลือกภาพจากคลังหรือถ่ายภาพใหม่</p>
          <div class="photo-grid">
            <button type="button" class="photo-slot photo-slot-wide" data-photo-type="signage" onclick="openPhotoModal('signage')" aria-label="ใส่รูปป้ายชื่อหน่วยงาน">
              <span class="slot-content"><span class="slot-label">ป้ายชื่อหน่วยงาน / จุดติดตั้ง</span><span class="slot-hint">แตะเพื่อใส่รูป</span></span>
            </button>
            <button type="button" class="photo-slot" data-photo-type="before1" onclick="openPhotoModal('before1')" aria-label="ใส่รูปก่อนติดตั้งรูปที่ 1">
              <span class="slot-content"><span class="slot-label">ก่อนติดตั้ง 1</span><span class="slot-hint">แตะเพื่อใส่รูป</span></span>
            </button>
            <button type="button" class="photo-slot" data-photo-type="after1" onclick="openPhotoModal('after1')" aria-label="ใส่รูปหลังติดตั้งรูปที่ 1">
              <span class="slot-content"><span class="slot-label">หลังติดตั้ง 1</span><span class="slot-hint">แตะเพื่อใส่รูป</span></span>
            </button>
            <button type="button" class="photo-slot" data-photo-type="before2" onclick="openPhotoModal('before2')" aria-label="ใส่รูปก่อนติดตั้งรูปที่ 2">
              <span class="slot-content"><span class="slot-label">ก่อนติดตั้ง 2</span><span class="slot-hint">แตะเพื่อใส่รูป</span></span>
            </button>
            <button type="button" class="photo-slot" data-photo-type="after2" onclick="openPhotoModal('after2')" aria-label="ใส่รูปหลังติดตั้งรูปที่ 2">
              <span class="slot-content"><span class="slot-label">หลังติดตั้ง 2</span><span class="slot-hint">แตะเพื่อใส่รูป</span></span>
            </button>
          </div>
        </section>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <footer class="report-footer">รองรับ JPG, PNG, GIF, WEBP ขนาดไม่เกิน 2 MB ต่อรูป</footer>
      </section>
    </main>

    <div id="photoModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <section class="modal">
        <h2 id="modalTitle" class="modal-title">ใส่รูปภาพ</h2>
        <p class="modal-note">เลือกจากคลังรูปหรือเปิดกล้องของมือถือ</p>
        <div class="source-buttons">
          <button type="button" class="button-gallery" onclick="openGallery()">เลือกรูปจากคลัง</button>
          <button type="button" class="button-camera" onclick="openCamera()">ถ่ายรูปด้วยกล้อง</button>
        </div>
        <input id="galleryFile" class="hidden-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
        <input id="cameraFile" class="hidden-input" type="file" accept="image/*" capture="environment">
        <div id="pendingPreview" class="pending-preview">
          <img id="pendingImage" alt="ตัวอย่างรูปที่เลือก">
          <div id="pendingFile" class="pending-file"></div>
        </div>
        <button id="savePhotoBtn" type="button" class="button-save" onclick="savePhoto()" disabled>บันทึกรูปช่องนี้</button>
        <button type="button" class="button-cancel" onclick="closePhotoModal()">ยกเลิก</button>
      </section>
    </div>

    <script>
      const MAX_FILE_SIZE = 2 * 1024 * 1024;
      const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      const PHOTO_LABELS = {
        signage: 'ป้ายชื่อหน่วยงาน / จุดติดตั้ง',
        before1: 'ก่อนติดตั้ง 1',
        after1: 'หลังติดตั้ง 1',
        before2: 'ก่อนติดตั้ง 2',
        after2: 'หลังติดตั้ง 2'
      };

      let jobDataList = [];
      let activePhotoType = '';
      let pendingFile = null;
      let pendingDataUrl = '';

      window.addEventListener('load', function() {
        document.getElementById('galleryFile').addEventListener('change', handleFileChange);
        document.getElementById('cameraFile').addEventListener('change', handleFileChange);
        loadJobs();
      });

      function loadJobs() {
        setStatus('กำลังโหลดรายการ Job...');
        google.script.run
          .withSuccessHandler(populateJobs)
          .withFailureHandler(function(error) {
            setStatus('โหลดรายการ Job ไม่สำเร็จ: ' + getErrorMessage(error), true);
          })
          .getJobData();
      }

      function populateJobs(jobs) {
        jobDataList = jobs || [];
        const select = document.getElementById('jobSelect');
        select.innerHTML = '<option value="">-- เลือก Job --</option>';
        jobDataList.forEach(function(job, index) {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = job.jobNo;
          select.appendChild(option);
        });
        select.addEventListener('change', updateLocation);
        setStatus(jobDataList.length ? '' : 'ไม่พบ Job ใน Asset_Master', !jobDataList.length);
      }

      function updateLocation() {
        const selectedIndex = document.getElementById('jobSelect').value;
        document.getElementById('locationDisplay').value = selectedIndex === ''
          ? ''
          : jobDataList[selectedIndex].location;
      }

      function openPhotoModal(photoType) {
        if (document.getElementById('jobSelect').value === '') {
          setStatus('กรุณาเลือก Job ก่อนใส่รูป', true);
          return;
        }

        activePhotoType = photoType;
        resetPendingPhoto();
        document.getElementById('modalTitle').textContent = 'ใส่รูป: ' + PHOTO_LABELS[photoType];
        document.getElementById('photoModal').classList.add('is-open');
      }

      function closePhotoModal() {
        resetPendingPhoto();
        document.getElementById('photoModal').classList.remove('is-open');
        activePhotoType = '';
      }

      function openGallery() {
        document.getElementById('galleryFile').click();
      }

      function openCamera() {
        document.getElementById('cameraFile').click();
      }

      function handleFileChange(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const validationMessage = validateFile(file);
        if (validationMessage) {
          resetPendingPhoto();
          setStatus(validationMessage, true);
          return;
        }

        pendingFile = file;
        const reader = new FileReader();
        reader.onload = function(loadEvent) {
          pendingDataUrl = loadEvent.target.result;
          document.getElementById('pendingImage').src = pendingDataUrl;
          document.getElementById('pendingFile').textContent = file.name + ' (' + formatBytes(file.size) + ')';
          document.getElementById('pendingPreview').classList.add('is-visible');
          document.getElementById('savePhotoBtn').disabled = false;
        };
        reader.onerror = function() {
          resetPendingPhoto();
          setStatus('ไม่สามารถอ่านไฟล์รูปภาพได้', true);
        };
        reader.readAsDataURL(file);
      }

      function savePhoto() {
        if (!pendingFile || !pendingDataUrl || !activePhotoType) {
          setStatus('กรุณาเลือกรูปภาพก่อนบันทึก', true);
          return;
        }

        const selectedIndex = document.getElementById('jobSelect').value;
        if (selectedIndex === '') {
          closePhotoModal();
          setStatus('กรุณาเลือก Job ก่อนใส่รูป', true);
          return;
        }

        const job = jobDataList[selectedIndex];
        const saveButton = document.getElementById('savePhotoBtn');
        saveButton.disabled = true;
        saveButton.textContent = 'กำลังบันทึกรูป...';
        setStatus('กำลังบันทึก ' + PHOTO_LABELS[activePhotoType] + ' โปรดรอสักครู่');

        google.script.run
          .withSuccessHandler(function(message) {
            renderFilledSlot(activePhotoType, pendingDataUrl);
            closePhotoModal();
            saveButton.textContent = 'บันทึกรูปช่องนี้';
            setStatus(message, false, true);
          })
          .withFailureHandler(function(error) {
            saveButton.disabled = false;
            saveButton.textContent = 'บันทึกรูปช่องนี้';
            setStatus('เกิดข้อผิดพลาด: ' + getErrorMessage(error), true);
          })
          .uploadImageToSheet(
            job.jobNo,
            job.location,
            activePhotoType,
            pendingDataUrl,
            pendingFile.name
          );
      }

      function renderFilledSlot(photoType, dataUrl) {
        const slot = document.querySelector('[data-photo-type="' + photoType + '"]');
        if (!slot) return;
        slot.classList.add('is-filled');
        slot.innerHTML = '<img class="slot-image" alt="' + PHOTO_LABELS[photoType] + '" src="' + dataUrl + '"><span class="slot-status">บันทึกแล้ว</span>';
      }

      function resetPendingPhoto() {
        pendingFile = null;
        pendingDataUrl = '';
        document.getElementById('galleryFile').value = '';
        document.getElementById('cameraFile').value = '';
        document.getElementById('pendingImage').removeAttribute('src');
        document.getElementById('pendingFile').textContent = '';
        document.getElementById('pendingPreview').classList.remove('is-visible');
        document.getElementById('savePhotoBtn').disabled = true;
        document.getElementById('savePhotoBtn').textContent = 'บันทึกรูปช่องนี้';
      }

      function validateFile(file) {
        if (!ALLOWED_TYPES.includes(file.type)) {
          return 'รองรับเฉพาะไฟล์ JPG, PNG, GIF หรือ WEBP';
        }
        if (file.size > MAX_FILE_SIZE) {
          return 'ไฟล์รูปภาพต้องมีขนาดไม่เกิน 2 MB';
        }
        return '';
      }

      function formatBytes(bytes) {
        return (bytes / 1024).toFixed(0) + ' KB';
      }

      function getErrorMessage(error) {
        return error && error.message ? error.message : String(error || 'ไม่ทราบสาเหตุ');
      }

      function setStatus(message, isError, isSuccess) {
        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = 'status' + (isError ? ' error' : '') + (isSuccess ? ' success' : '');
      }
    </script>
  </body>
</html>
