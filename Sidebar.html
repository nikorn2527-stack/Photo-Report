<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 10px; color: #202124; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
      select, input[type="text"], input[type="file"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      input[readonly] { background: #f0f0f0; border: 1px solid #ccc; }
      button {
        width: 100%;
        padding: 10px;
        background: #188038;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 4px;
      }
      button:disabled { background: #9aa0a6; cursor: wait; }
      #status { margin-top: 15px; font-size: 14px; text-align: center; white-space: pre-wrap; }
      .hint { margin-top: 4px; color: #5f6368; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="form-group">
      <label for="jobSelect">เลข Job:</label>
      <select id="jobSelect" onchange="updateLocation()">
        <option value="">กำลังโหลด...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="locationDisplay">สถานที่ติดตั้ง:</label>
      <input type="text" id="locationDisplay" readonly placeholder="จะแสดงอัตโนมัติ">
    </div>

    <div class="form-group">
      <label for="imageType">จุดที่ถ่ายรูป:</label>
      <select id="imageType">
        <option value="signage">ป้ายชื่อหน่วยงาน / จุดติดตั้ง</option>
        <option value="before1">ก่อนติดตั้ง (รูปที่ 1)</option>
        <option value="after1">หลังติดตั้ง (รูปที่ 1)</option>
        <option value="before2">ก่อนติดตั้ง (รูปที่ 2)</option>
        <option value="after2">หลังติดตั้ง (รูปที่ 2)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="imageFile">เลือกไฟล์รูปภาพ:</label>
      <input type="file" id="imageFile" accept="image/jpeg,image/png,image/gif,image/webp">
      <div class="hint">รองรับ JPG, PNG, GIF, WEBP ขนาดไม่เกิน 2 MB</div>
    </div>

    <button id="uploadBtn" onclick="uploadImage()">อัปโหลดเข้าชีท</button>
    <div id="status"></div>

    <script>
      const MAX_FILE_SIZE = 2 * 1024 * 1024;
      const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      let jobDataList = [];

      window.onload = function() {
        setStatus('กำลังโหลดรายการ Job...');
        google.script.run
          .withSuccessHandler(populateJobs)
          .withFailureHandler(function(error) {
            setStatus('โหลดรายการ Job ไม่สำเร็จ: ' + error.message);
          })
          .getJobData();
      };

      function populateJobs(jobs) {
        jobDataList = jobs || [];
        const select = document.getElementById('jobSelect');
        select.innerHTML = '<option value="">-- เลือก Job --</option>';
        jobDataList.forEach(function(job, index) {
          const option = document.createElement('option');
          option.value = index;
          option.text = job.jobNo;
          select.appendChild(option);
        });
        setStatus(jobDataList.length ? '' : 'ไม่พบ Job ใน Asset_Master');
      }

      function updateLocation() {
        const selectedIndex = document.getElementById('jobSelect').value;
        document.getElementById('locationDisplay').value = selectedIndex === ''
          ? ''
          : jobDataList[selectedIndex].location;
      }

      function uploadImage() {
        const jobSelect = document.getElementById('jobSelect');
        const fileInput = document.getElementById('imageFile');
        const imageType = document.getElementById('imageType').value;

        if (jobSelect.value === '' || fileInput.files.length === 0) {
          setStatus('กรุณาเลือก Job และไฟล์รูปภาพ');
          return;
        }

        const file = fileInput.files[0];
        if (!ALLOWED_TYPES.includes(file.type)) {
          setStatus('รองรับเฉพาะไฟล์ JPG, PNG, GIF หรือ WEBP');
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          setStatus('ไฟล์รูปภาพต้องมีขนาดไม่เกิน 2 MB');
          return;
        }

        const job = jobDataList[jobSelect.value];
        const button = document.getElementById('uploadBtn');
        button.disabled = true;
        setStatus('กำลังบันทึกรูปภาพ... โปรดรอสักครู่');

        const reader = new FileReader();
        reader.onload = function(event) {
          google.script.run
            .withSuccessHandler(function(message) {
              setStatus(message);
              button.disabled = false;
              fileInput.value = '';
            })
            .withFailureHandler(function(error) {
              setStatus('เกิดข้อผิดพลาด: ' + error.message);
              button.disabled = false;
            })
            .uploadImageToSheet(
              job.jobNo,
              job.location,
              imageType,
              event.target.result,
              file.name
            );
        };
        reader.onerror = function() {
          setStatus('ไม่สามารถอ่านไฟล์รูปภาพได้');
          button.disabled = false;
        };
        reader.readAsDataURL(file);
      }

      function setStatus(message) {
        document.getElementById('status').innerText = message || '';
      }
    </script>
  </body>
</html>
