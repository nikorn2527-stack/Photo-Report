<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
      select, input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
      input[readonly] { background-color: #f0f0f0; border: 1px solid #ccc; }
      button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px;}
      button:disabled { background-color: #ccc; }
      #status { margin-top: 15px; font-size: 14px; color: #333; text-align: center; }
    </style>
  </head>
  <body>
    
    <div class="form-group">
      <label>เลข Job:</label>
      <select id="jobSelect" onchange="updateLocation()">
        <option value="">กำลังโหลด...</option>
      </select>
    </div>

    <div class="form-group">
      <label>สถานที่ติดตั้ง:</label>
      <input type="text" id="locationDisplay" readonly placeholder="จะแสดงอัตโนมัติ">
    </div>

    <div class="form-group">
      <label>จุดที่ถ่ายรูป:</label>
      <select id="imageType">
        <option value="signage">🏢 ป้ายชื่อหน่วยงาน / จุดติดตั้ง</option>
        <option value="before1">📷 ก่อนติดตั้ง (รูปที่ 1)</option>
        <option value="after1">📷 หลังติดตั้ง (รูปที่ 1)</option>
        <option value="before2">📷 ก่อนติดตั้ง (รูปที่ 2)</option>
        <option value="after2">📷 หลังติดตั้ง (รูปที่ 2)</option>
      </select>
    </div>

    <div class="form-group">
      <label>เลือกไฟล์รูปภาพ:</label>
      <input type="file" id="imageFile" accept="image/*">
    </div>

    <button id="uploadBtn" onclick="uploadImage()">อัพโหลดเข้าชีท</button>
    <div id="status"></div>

    <script>
      let jobDataList = [];

      // โหลดข้อมูล Job ทันทีที่เปิด Sidebar
      window.onload = function() {
        google.script.run.withSuccessHandler(populateJobs).getJobData();
      };

      function populateJobs(jobs) {
        jobDataList = jobs;
        let select = document.getElementById('jobSelect');
        select.innerHTML = '<option value="">-- เลือก Job --</option>';
        jobs.forEach((job, index) => {
          let option = document.createElement('option');
          option.value = index; 
          option.text = job.jobNo;
          select.appendChild(option);
        });
      }

      function updateLocation() {
        let selectedIndex = document.getElementById('jobSelect').value;
        if(selectedIndex !== "") {
          document.getElementById('locationDisplay').value = jobDataList[selectedIndex].location;
        } else {
          document.getElementById('locationDisplay').value = "";
        }
      }

      function uploadImage() {
        let jobSelect = document.getElementById('jobSelect');
        let fileInput = document.getElementById('imageFile');
        let imageType = document.getElementById('imageType').value;
        
        if (jobSelect.value === "" || fileInput.files.length === 0) {
          alert("กรุณาเลือก Job และไฟล์รูปภาพ");
          return;
        }

        let jobNo = jobDataList[jobSelect.value].jobNo;
        let location = document.getElementById('locationDisplay').value;
        let file = fileInput.files[0];
        
        let reader = new FileReader();
        reader.onload = function(e) {
          let base64Data = e.target.result;
          
          document.getElementById('status').innerText = "กำลังอัพโหลด... โปรดรอสักครู่";
          document.getElementById('uploadBtn').disabled = true;

          google.script.run
            .withSuccessHandler(function(msg) {
              document.getElementById('status').innerText = msg;
              document.getElementById('uploadBtn').disabled = false;
              fileInput.value = ""; // เคลียร์ไฟล์หลังเสร็จ
            })
            .uploadImageToSheet(jobNo, location, imageType, base64Data, file.name);
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
