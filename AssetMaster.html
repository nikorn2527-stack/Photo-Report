<!DOCTYPE html>
<html lang="th">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      :root {
        --green: #188038;
        --green-dark: #0d652d;
        --blue: #1967d2;
        --text: #202124;
        --muted: #5f6368;
        --border: #c7cbd1;
        --surface: #f6f8fb;
        --danger: #b3261e;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #eef1f5;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }

      body { padding: 8px 8px 30px; }
      .app { width: 100%; max-width: 620px; margin: 0 auto; }
      .page {
        min-height: calc(100vh - 38px);
        padding: 16px;
        border: 1px solid #b9bec6;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(60, 64, 67, .15);
      }
      .header { padding-bottom: 13px; border-bottom: 2px solid #202124; }
      .back-link { display: inline-block; margin-bottom: 12px; color: var(--blue); font-size: 14px; text-decoration: none; }
      .title { margin: 0; font-size: 23px; line-height: 1.25; }
      .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 15px 0 10px; }
      .search { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #9aa0a6; border-radius: 9px; font: inherit; }
      .button { min-height: 48px; padding: 10px 14px; border: 0; border-radius: 9px; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .button:disabled { background: #9aa0a6 !important; cursor: wait; }
      .button-add { background: var(--green); }
      .button-add:hover { background: var(--green-dark); }
      .button-save { width: 100%; background: var(--green); }
      .button-cancel { width: 100%; margin-top: 8px; border: 1px solid #9aa0a6; background: #fff; color: var(--text); }
      .form { margin-bottom: 14px; padding: 14px; border: 1px solid #9aa0a6; border-radius: 10px; background: var(--surface); }
      .form[hidden] { display: none; }
      .form-title { margin: 0 0 12px; font-size: 18px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .form-field { margin-bottom: 9px; }
      .form-field:first-child { grid-column: 1 / -1; }
      .form-field label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
      .form-field input { width: 100%; min-height: 45px; padding: 9px 10px; border: 1px solid #9aa0a6; border-radius: 7px; background: #fff; font: inherit; }
      .form-actions { margin-top: 3px; }
      .count { margin: 0 0 9px; color: var(--muted); font-size: 13px; }
      .list { display: grid; gap: 9px; }
      .row { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
      .row-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .job { color: var(--text); font-size: 16px; font-weight: 700; }
      .location { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }
      .edit { flex: 0 0 auto; min-height: 40px; padding: 8px 12px; border: 1px solid #9aa0a6; border-radius: 7px; background: #fff; color: var(--blue); font: inherit; font-weight: 600; cursor: pointer; }
      .empty { padding: 22px 12px; color: var(--muted); text-align: center; }
      .status { min-height: 22px; margin-top: 11px; color: var(--muted); font-size: 14px; text-align: center; }
      .status.error { color: var(--danger); }
      .status.success { color: var(--green-dark); }
      .hidden { display: none; }

      @media (max-width: 380px) {
        body { padding: 6px 6px 24px; }
        .page { padding: 12px; }
        .toolbar { grid-template-columns: 1fr; }
        .button-add { width: 100%; }
        .form-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="page">
        <header class="header">
          <a class="back-link" href="?page=report">← กลับหน้า Photo Report</a>
          <h1 class="title">จัดการ Asset_Master</h1>
          <p class="subtitle">เพิ่ม ค้นหา และแก้ไขข้อมูล Job จากหน้าเว็บแยก</p>
        </header>

        <div class="toolbar">
          <input id="search" class="search" type="search" placeholder="ค้นหา Job, อาคาร, แผนก หรือห้อง" oninput="filterRows()">
          <button type="button" class="button button-add" onclick="openForm()">+ เพิ่ม Job</button>
        </div>

        <section id="form" class="form" hidden>
          <h2 id="formTitle" class="form-title">เพิ่มข้อมูล Job</h2>
          <input id="rowNumber" type="hidden">
          <div class="form-grid">
            <div class="form-field">
              <label for="jobNo">เลข Job</label>
              <input id="jobNo" type="text" placeholder="เช่น JOB-001" autocapitalize="characters">
            </div>
            <div class="form-field">
              <label for="building">อาคาร</label>
              <input id="building" type="text" placeholder="อาคาร">
            </div>
            <div class="form-field">
              <label for="floor">ชั้น</label>
              <input id="floor" type="text" placeholder="ชั้น">
            </div>
            <div class="form-field">
              <label for="department">แผนก</label>
              <input id="department" type="text" placeholder="แผนก">
            </div>
            <div class="form-field">
              <label for="room">ห้อง</label>
              <input id="room" type="text" placeholder="ห้อง">
            </div>
          </div>
          <div class="form-actions">
            <button id="saveButton" type="button" class="button button-save" onclick="saveRow()">บันทึกข้อมูล</button>
            <button type="button" class="button button-cancel" onclick="closeForm()">ยกเลิก</button>
          </div>
        </section>

        <p id="count" class="count">กำลังโหลดข้อมูล...</p>
        <div id="list" class="list"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script>
      let rows = [];

      window.addEventListener('load', loadRows);

      function loadRows() {
        setStatus('กำลังโหลดข้อมูล Asset_Master...');
        google.script.run
          .withSuccessHandler(function(data) {
            rows = data || [];
            filterRows();
            setStatus('');
          })
          .withFailureHandler(function(error) {
            setStatus('โหลดข้อมูลไม่สำเร็จ: ' + getErrorMessage(error), true);
          })
          .getAssetMasterRows();
      }

      function filterRows() {
        const query = document.getElementById('search').value.trim().toLowerCase();
        const filtered = rows.filter(function(item) {
          return [item.jobNo, item.building, item.floor, item.department, item.room]
            .join(' ')
            .toLowerCase()
            .indexOf(query) !== -1;
        });

        document.getElementById('count').textContent = 'แสดง ' + filtered.length + ' จาก ' + rows.length + ' รายการ';
        const list = document.getElementById('list');
        list.innerHTML = '';

        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = query ? 'ไม่พบข้อมูลที่ค้นหา' : 'ยังไม่มีข้อมูล Job';
          list.appendChild(empty);
          return;
        }

        filtered.forEach(function(item) {
          const row = document.createElement('article');
          row.className = 'row';
          const main = document.createElement('div');
          main.className = 'row-main';

          const info = document.createElement('div');
          const job = document.createElement('div');
          job.className = 'job';
          job.textContent = item.jobNo || '(ไม่มีเลข Job)';
          const location = document.createElement('div');
          location.className = 'location';
          location.textContent = [item.building, item.floor, item.department, item.room]
            .filter(function(value) { return value; })
            .join('  |  ') || 'ยังไม่มีรายละเอียดสถานที่';
          info.appendChild(job);
          info.appendChild(location);

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'edit';
          edit.textContent = 'แก้ไข';
          edit.addEventListener('click', function() { openForm(item); });

          main.appendChild(info);
          main.appendChild(edit);
          row.appendChild(main);
          list.appendChild(row);
        });
      }

      function openForm(item) {
        item = item || {};
        document.getElementById('form').hidden = false;
        document.getElementById('formTitle').textContent = item.rowNumber ? 'แก้ไขข้อมูล Job' : 'เพิ่มข้อมูล Job';
        document.getElementById('rowNumber').value = item.rowNumber || '';
        document.getElementById('jobNo').value = item.jobNo || '';
        document.getElementById('building').value = item.building || '';
        document.getElementById('floor').value = item.floor || '';
        document.getElementById('department').value = item.department || '';
        document.getElementById('room').value = item.room || '';
        document.getElementById('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('jobNo').focus();
      }

      function closeForm() {
        document.getElementById('form').hidden = true;
        ['rowNumber', 'jobNo', 'building', 'floor', 'department', 'room'].forEach(function(id) {
          document.getElementById(id).value = '';
        });
      }

      function saveRow() {
        const jobNo = document.getElementById('jobNo').value.trim().toUpperCase();
        if (!jobNo) {
          setStatus('กรุณากรอกเลข Job', true);
          return;
        }

        const button = document.getElementById('saveButton');
        button.disabled = true;
        button.textContent = 'กำลังบันทึก...';
        setStatus('กำลังบันทึกข้อมูล...');

        google.script.run
          .withSuccessHandler(function(result) {
            button.disabled = false;
            button.textContent = 'บันทึกข้อมูล';
            closeForm();
            setStatus(result.message, false, true);
            loadRows();
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            button.textContent = 'บันทึกข้อมูล';
            setStatus('บันทึกไม่สำเร็จ: ' + getErrorMessage(error), true);
          })
          .saveAssetMasterRow(
            document.getElementById('rowNumber').value,
            {
              jobNo: jobNo,
              building: document.getElementById('building').value.trim(),
              floor: document.getElementById('floor').value.trim(),
              department: document.getElementById('department').value.trim(),
              room: document.getElementById('room').value.trim()
            }
          );
      }

      function getErrorMessage(error) {
        return error && error.message ? error.message : String(error || 'ไม่ทราบสาเหตุ');
      }

      function setStatus(message, isError, isSuccess) {
        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = 'status' + (isError ? ' error' : '') + (isSuccess ? ' success' : '');
      }
    </script>
  </body>
</html>
